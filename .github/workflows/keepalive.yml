name: Keep database awake
# Supabase free plan pauses a project after about a week with no activity.
# This pings the database every 3 days so it never pauses.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" "https://cpphymyouugaqkufphcq.supabase.co/rest/v1/schedules?select=id&limit=1" -H "apikey: sb_publishable_Q_9Cn11tSC6hraPhQcQItg_oKMPD_8i"
